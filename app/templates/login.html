{% extends 'base.html' %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock css %}

{% block content %}
{% include 'navbar.html' %}

<main class="login-page">
    <section class="login-container">
        <p class="login-kicker">Admin access</p>
        <h1>Admin Login</h1>
        <p class="login-copy">Sign in to manage disasters, review submissions, and update dashboard settings.</p>
        <form method="post" action="{% url 'login' %}" class="login-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    </section>
</main>

{% endblock content %}
