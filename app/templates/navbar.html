

{% load static %}

<link rel="stylesheet" href="{% static 'css/navbar.css' %}">
<header class="site-nav">
    <div class="site-nav__inner">
        <a href="{% url 'landing' %}" class="site-nav__brand">
            <img src="{% static 'images/logo.png' %}" alt="Logo" class="site-nav__logo">
            <span>Volunteer Tracking</span>
        </a>

        <button class="site-nav__toggle" aria-label="Open navigation">
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
        </button>

        <nav class="site-nav__links" id="nav-links" aria-label="Primary">
            <a href="{% url 'landing' %}" class="site-nav__link {% if request.path == '/' %}is-active{% endif %}">Home</a>
            <a href="{% url 'forms' %}" class="site-nav__link {% if '/forms/' in request.path %}is-active{% endif %}">Forms</a>
            <a href="{% url 'faq' %}" class="site-nav__link {% if '/faq/' in request.path %}is-active{% endif %}">FAQ</a>
        </nav>
    </div>
</header>

<script>
    const toggle = document.querySelector('.site-nav__toggle');
    const nav = document.querySelector('.site-nav__links');

    toggle.addEventListener('click', () => {
        nav.classList.toggle('is-open');
    });
</script>
